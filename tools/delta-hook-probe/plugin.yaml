name: delta-hook-probe
version: "0.0.1"
description: Scratch probe — logs sanitized hook payloads (field names + types) for the Delta ACP bridge. Write-only, no tools, no state.
author: Queque
provides_hooks:
  - pre_llm_call
  - post_llm_call
  - post_api_request
  - pre_tool_call
  - post_tool_call
  - on_stream_start
  - on_stream_delta
  - on_stream_end
  - on_interim_message
  - on_human_input_request
  - on_human_input_resolved
  - post_gateway_admission
  - on_session_start
  - on_session_open
  - on_session_end
  - on_session_finalize
  - on_session_reset
  - agent_loop_stopped
